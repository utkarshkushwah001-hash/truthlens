<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="TruthLens validation response and image estimate status.">
  <title>Analysis status: TruthLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Sofia+Sans+Extra+Condensed:wght@200;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="page page--tool">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="wordmark" href="index.html" aria-label="TruthLens home">TruthLens</a>
      <p class="header-note">Image validation</p>
    </div>
  </header>
  <main class="container tool-main tool-main--narrow">
    <div class="screen-heading">
      <p class="page-note">Image workspace / 02</p>
      <h1>Validation response received.</h1>
      <p class="lead">This page displays the backend response. It does not simulate AI detection or run a hidden analysis process.</p>
    </div>
    <section class="response-sheet" aria-live="polite">
      <p id="status" class="response-status">Loading saved response…</p>
      <p id="message" class="response-message"></p>
      <button id="continueBtn" class="button button--primary" type="button">View result</button>
    </section>
  </main>
<script>
(() => {
  const status = document.getElementById('status');
  const message = document.getElementById('message');
  const raw = sessionStorage.getItem('truthlensResult');
  if (!raw) {
    status.textContent = 'No validation response found';
    message.textContent = 'Return to the upload page and validate an image first.';
    document.getElementById('continueBtn').textContent = 'Back to upload';
    document.getElementById('continueBtn').onclick = () => window.location.href = 'upload.html';
    return;
  }
  try {
    const result = JSON.parse(raw);
    const detectionAvailable = result.checks && ['model_estimate', 'validated'].includes(result.checks.ai_image_detection);
    status.textContent = detectionAvailable
      ? (result.verdict || 'Inconclusive')
      : 'Inconclusive: detector not configured';
    message.textContent = detectionAvailable
      ? (result.message || 'The detector returned an estimate.')
      : 'Install and enable the local Smaug detector to get an AI-generated or likely-real estimate.';
  } catch (_) {
    status.textContent = 'Could not read the response';
    message.textContent = 'Return to the upload page and try again.';
  }
  document.getElementById('continueBtn').onclick = () => window.location.href = 'result.html';
})();
</script>
</body>
</html>
