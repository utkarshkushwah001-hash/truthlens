<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Analysis status — TruthLens</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#09090b] text-white">
  <main class="mx-auto max-w-3xl px-6 py-20">
    <a href="index.html" class="text-xl font-semibold text-violet-300">TruthLens</a>
    <p class="mt-12 text-xs font-semibold uppercase tracking-[.22em] text-violet-300">Image workspace / 02</p>
    <h1 class="mt-4 text-4xl font-semibold">Validation response received</h1>
    <p class="mt-4 leading-7 text-zinc-400">This page displays the backend response. It does not simulate AI detection or run a hidden analysis process.</p>
    <section class="mt-8 rounded-2xl border border-zinc-800 bg-zinc-950 p-6">
      <p id="status" class="font-medium text-amber-200">Loading saved response…</p>
      <p id="message" class="mt-3 text-sm leading-6 text-zinc-400"></p>
      <button id="continueBtn" class="mt-6 rounded-lg bg-violet-300 px-5 py-3 font-semibold text-zinc-950">View result</button>
    </section>
  </main>
<script>
(() => {
  const status = document.getElementById('status');
  const message = document.getElementById('message');
  const raw = sessionStorage.getItem('truthlensResult');
  if (!raw) {
    status.textContent = 'No validation response found';
    message.textContent = 'Return to the upload page and validate an image first.';
    document.getElementById('continueBtn').textContent = 'Back to upload';
    document.getElementById('continueBtn').onclick = () => window.location.href = 'upload.html';
    return;
  }
  try {
    const result = JSON.parse(raw);
    status.textContent = result.verdict || result.status || 'Inconclusive';
    message.textContent = result.message || 'The backend returned a response without a message.';
  } catch (_) {
    status.textContent = 'Could not read the response';
    message.textContent = 'Return to the upload page and try again.';
  }
  document.getElementById('continueBtn').onclick = () => window.location.href = 'result.html';
})();
</script>
</body>
</html>
