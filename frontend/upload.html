<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - TruthLens</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#09090B] text-white min-h-screen relative overflow-x-hidden">

    <!-- Background Grid -->
    <div class="absolute inset-0 opacity-10"
        style="
        background-image: linear-gradient(#2a2a2a 1px, transparent 1px),
                          linear-gradient(to right, #2a2a2a 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: 0;">
    </div>

    <!-- Background Glow -->
    <div class="absolute top-[20%] left-[35%] w-[500px] h-[500px]
    bg-purple-500 rounded-full blur-[180px] opacity-10 z-0">
    </div>

    <!-- Navbar -->
    <nav class="relative z-10 px-16 py-8 flex items-center gap-6">
        <a href="index.html" class="text-gray-400 hover:text-purple-400 transition">
            ← Back
        </a>

        <h1 class="text-2xl font-bold text-purple-400
        drop-shadow-[0_0_12px_rgba(168,85,247,0.6)]">
            TruthLens
        </h1>
    </nav>

    <!-- Heading -->
    <section class="relative z-10 text-center mt-12">
        <h2 class="text-4xl font-bold">
            Upload image for analysis
        </h2>

        <p class="text-gray-500 mt-4">
            Upload an image and let TruthLens verify authenticity.
        </p>
    </section>

    <!-- Split Layout -->
    <section class="relative z-10 flex justify-center gap-10 mt-14 px-10 flex-wrap">

        <!-- Upload Card -->
        <div class="w-[450px] h-[330px]
        border-2 border-dashed border-gray-700 rounded-3xl
        flex flex-col items-center justify-center
        hover:border-purple-500 hover:shadow-lg hover:shadow-purple-500/10
        transition duration-300 backdrop-blur-sm">

            <div class="text-5xl mb-6">↑</div>

            <p class="text-xl font-semibold">Drag image here</p>

            <p class="text-gray-500 mt-3">PNG • JPG • WEBP</p>

            <input type="file" id="fileInput" accept="image/*" class="hidden">

            <button onclick="document.getElementById('fileInput').click()"
            class="mt-8 border border-purple-500 px-6 py-3 rounded-xl
            hover:shadow-lg hover:shadow-purple-500/20 transition">
                Choose File
            </button>

        </div>

        <!-- Preview Card -->
        <div class="w-[450px] h-[330px]
        border border-gray-800 rounded-3xl
        flex flex-col items-center justify-center
        backdrop-blur-sm overflow-hidden">

            <img id="previewImage"
            class="hidden w-full h-full object-cover">

            <div id="previewPlaceholder">

                <div class="text-5xl mb-6 opacity-50">🖼</div>

                <p class="text-xl font-semibold text-center">Preview</p>

                <p class="text-gray-500 mt-3 text-center">
                    No image selected
                </p>

            </div>

        </div>

    </section>

    <!-- Bottom Button -->
    <section class="relative z-10 flex justify-center mt-12">

        <button id="startBtn"
        disabled
        class="px-10 py-4 rounded-2xl
        border border-gray-700 text-gray-500 cursor-not-allowed">

            Start Analysis

        </button>

    </section>


<script>

const fileInput = document.getElementById("fileInput");
const previewImage = document.getElementById("previewImage");
const previewPlaceholder = document.getElementById("previewPlaceholder");
const startBtn = document.getElementById("startBtn");


/* image preview */
fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            previewImage.src = e.target.result;
            previewImage.classList.remove("hidden");
            previewPlaceholder.style.display = "none";

            startBtn.disabled = false;

            startBtn.classList.remove(
                "border-gray-700",
                "text-gray-500",
                "cursor-not-allowed"
            );

            startBtn.classList.add(
                "border-purple-500",
                "text-white"
            );

        };

        reader.readAsDataURL(file);
    }

});


/* send to backend */
startBtn.addEventListener("click", async function(){

    const file = fileInput.files[0];

    if(!file){
        alert("Please select image");
        return;
    }

    let formData = new FormData();
    formData.append("image", file);

    try{

        /* loading state */
        startBtn.innerText = "Analyzing...";
        startBtn.disabled = true;

        const response = await fetch("http://127.0.0.1:5000/analyze",{
            method:"POST",
            body:formData
        });

        const data = await response.json();

        console.log(data);

        /* save backend results */
        localStorage.setItem("scanScore", data.score);
        localStorage.setItem("scanVerdict", data.verdict);
        localStorage.setItem("fileSize", data.file_size_kb);

        /* save image */
        localStorage.setItem("uploadedImage", previewImage.src);

        /* go next */
        window.location.href = "analyze.html";

    }

    catch(error){

        alert("Backend connection failed");

        startBtn.innerText = "Start Analysis";
        startBtn.disabled = false;

        console.log(error);

    }

});

</script>

</body>
</html>
