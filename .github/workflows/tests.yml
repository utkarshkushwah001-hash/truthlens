name: TruthLens tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile backend/app.py tests/test_app.py tools/evaluate_detector.py tools/run_detector_benchmark.py tools/calibrate_detector.py tests/test_evaluator.py tests/test_benchmark_runner.py tests/test_calibrate_detector.py
